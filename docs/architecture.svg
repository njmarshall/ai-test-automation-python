<svg width="100%" viewBox="0 0 680 820" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>ai-test-automation-python architecture overview</title>
  <desc>Full architecture diagram showing shared foundation, 4 project capstones, test layers, CI pipeline and design patterns</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #2C2C2A; }
      .th { font-size: 14px; font-weight: 600; }
      .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
      .c-gray rect { fill: #F1EFE8; stroke: #888780; }
      .c-purple rect { fill: #EEEDFE; stroke: #7F77DD; }
      .c-teal rect { fill: #E1F5EE; stroke: #1D9E75; }
      .c-amber rect { fill: #FAEEDA; stroke: #BA7517; }
      .c-coral rect { fill: #FAECE7; stroke: #D85A30; }
      .c-blue rect { fill: #E6F1FB; stroke: #378ADD; }
