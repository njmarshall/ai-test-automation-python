  <g class="c-blue">
    <rect x="30" y="274" width="620" height="44" rx="10" stroke-width="0.5"/>
    <text class="th" x="340" y="294" text-anchor="middle">api/ — config · client · models · data · assertions · tests</text>
    <text class="ts" x="340" y="310" text-anchor="middle">Singleton · Facade · CRTP · Factory · Fluent Interface · SOLID</text>
  </g>
  <g class="c-green">
    <rect x="30" y="328" width="620" height="44" rx="10" stroke-width="0.5"/>
    <text class="th" x="340" y="348" text-anchor="middle">ui/ — pages · tests (Playwright)</text>
    <text class="ts" x="340" y="364" text-anchor="middle">Page Object Model · BasePage · auto-wait · no XPath</text>
  </g>
  <g class="c-amber">
    <rect x="30" y="382" width="620" height="44" rx="10" stroke-width="0.5"/>
    <text class="th" x="340" y="402" text-anchor="middle">ai/generated/ — AI-generated test suites</text>
    <text class="ts" x="340" y="418" text-anchor="middle">37 tests · claude-sonnet-4-6 · StalenessDetector · DeepEval scored</text>
  </g>

  <!-- Arrow down -->
  <line x1="340" y1="426" x2="340" y2="451" class="arr" marker-end="url(#arrow)"/>

  <!-- CI -->
  <g class="c-gray">
    <rect x="30" y="456" width="620" height="54" rx="14" stroke-width="0.5"/>
    <text class="th" x="340" y="478" text-anchor="middle">GitHub Actions CI — 11 parallel jobs</text>
    <text class="ts" x="340" y="496" text-anchor="middle">FHIR API · FHIR UI · Insurance · Fintech · PetStore · Async · EventSeq · DeepEval</text>
  </g>

  <!-- Arrow down -->
  <line x1="340" y1="510" x2="340" y2="535" class="arr" marker-end="url(#arrow)"/>

  <!-- TEST COUNT -->
  <g class="c-teal">
    <rect x="30" y="540" width="620" height="54" rx="14" stroke-width="0.5"/>
    <text class="th" x="340" y="562" text-anchor="middle">95 passed · 1 skipped · 0 errors</text>
    <text class="ts" x="340" y="580" text-anchor="middle">Hand-crafted · AI-generated · Playwright UI · Async polling · LLM evaluation</text>
  </g>

  <!-- PATTERNS -->
  <text class="th" x="340" y="622" text-anchor="middle">Design patterns applied throughout</text>
  <g class="c-purple"><rect x="30" y="632" width="90" height="32" rx="6" stroke-width="0.5"/><text class="ts" x="75" y="652" text-anchor="middle">Singleton</text></g>
  <g class="c-teal"><rect x="132" y="632" width="72" height="32" rx="6" stroke-width="0.5"/><text class="ts" x="168" y="652" text-anchor="middle">Facade</text></g>
  <g class="c-amber"><rect x="216" y="632" width="64" height="32" rx="6" stroke-width="0.5"/><text class="ts" x="248" y="652" text-anchor="middle">Factory</text></g>
  <g class="c-coral"><rect x="292" y="632" width="56" height="32" rx="6" stroke-width="0.5"/><text class="ts" x="320" y="652" text-anchor="middle">CRTP</text></g>
  <g class="c-blue"><rect x="360" y="632" width="96" height="32" rx="6" stroke-width="0.5"/><text class="ts" x="408" y="652" text-anchor="middle">Fluent Interface</text></g>
  <g class="c-green"><rect x="468" y="632" width="112" height="32" rx="6" stroke-width="0.5"/><text class="ts" x="524" y="652" text-anchor="middle">Template Method</text></g>

  <g class="c-gray">
    <rect x="30" y="676" width="620" height="32" rx="6" stroke-width="0.5"/>
    <text class="ts" x="340" y="696" text-anchor="middle">SOLID — SRP · OCP · LSP · ISP · DIP applied throughout all layers</text>
  </g>

  <text class="ts" x="340" y="736" text-anchor="middle">Python 3.13 · pytest · httpx · Playwright · Anthropic SDK · Pydantic · Faker · DeepEval</text>
  <text class="ts" x="340" y="758" text-anchor="middle">github.com/njmarshall/ai-test-automation-python</text>
