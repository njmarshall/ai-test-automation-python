    <text class="th" x="580" y="220" text-anchor="middle">petstore</text>
    <text class="ts" x="580" y="236" text-anchor="middle">REST API</text>
  </g>

  <!-- Arrow down -->
  <line x1="340" y1="244" x2="340" y2="269" class="arr" marker-end="url(#arrow)"/>

