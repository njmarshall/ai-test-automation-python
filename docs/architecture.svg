    </style>
  </defs>

  <!-- Title -->
  <text class="th" x="340" y="28" text-anchor="middle" font-size="15">ai-test-automation-python</text>
  <text class="ts" x="340" y="46" text-anchor="middle">95 tests · 4 domains · 11 parallel CI jobs</text>

  <!-- SHARED FOUNDATION -->
  <g class="c-gray">
    <rect x="30" y="60" width="620" height="110" rx="14" stroke-width="0.5"/>
    <text class="th" x="340" y="82" text-anchor="middle">shared/ — reusable foundation</text>
  </g>
  <g class="c-purple">
    <rect x="50" y="92" width="96" height="64" rx="8" stroke-width="0.5"/>
    <text class="th" x="98" y="116" text-anchor="middle">config/</text>
    <text class="ts" x="98" y="132" text-anchor="middle">Singleton</text>
    <text class="ts" x="98" y="146" text-anchor="middle">env vars</text>
  </g>
  <g class="c-teal">
