    <text class="ts" x="206" y="132" text-anchor="middle">Facade</text>
    <text class="ts" x="206" y="146" text-anchor="middle">httpx client</text>
  </g>
  <g class="c-amber">
    <rect x="266" y="92" width="96" height="64" rx="8" stroke-width="0.5"/>
    <text class="th" x="314" y="116" text-anchor="middle">ai/</text>
    <text class="ts" x="314" y="132" text-anchor="middle">Template</text>
    <text class="ts" x="314" y="146" text-anchor="middle">Method</text>
  </g>
  <g class="c-coral">
    <rect x="374" y="92" width="96" height="64" rx="8" stroke-width="0.5"/>
    <text class="th" x="422" y="116" text-anchor="middle">async/</text>
    <text class="ts" x="422" y="132" text-anchor="middle">AsyncPoller</text>
    <text class="ts" x="422" y="146" text-anchor="middle">EventSeq</text>
  </g>
  <g class="c-blue">
    <rect x="482" y="92" width="96" height="64" rx="8" stroke-width="0.5"/>
