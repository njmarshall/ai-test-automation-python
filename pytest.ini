[pytest]
testpaths     = projects
python_files  = test_*.py
python_classes= Test*
python_functions = test_*
# Blocks deepeval's pytest11 entry-point plugin by default: importing it pulls in
# sentry_sdk, which starts a background thread whose finalizer deadlocks with the
# interpreter's GC at shutdown, hanging every plain `pytest` invocation in this repo
# (reproduces even on a single-assert trivial test with no deepeval usage at all).
# `deepeval test run` is unaffected — its CLI always appends `-p deepeval` itself,
# which overrides this block for that workflow only.
addopts = -p no:deepeval
markers =
    petstore: PetStore API test suite
    healthcare: Healthcare FHIR test suite
    insurance: Insurance API test suite
    fintech: Fintech market data test suite
    ui: UI tests (Playwright)
    insurance: Insurance API test suite
    fintech: Fintech market data test suite
    smoke: Smoke tests
    contract: Contract tests for API provider promises
