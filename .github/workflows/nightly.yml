# ------------------------------------------------------------------ #
#  Nightly Health Check                                               #
#                                                                     #
#  Why: ci.yml only runs on push and pull request. When nobody        #
#  commits for a week, nothing notices a broken dependency, a         #
#  changed sandbox, or a retired model. This workflow runs every      #
#  night whether or not anyone pushed.                                #
#                                                                     #
#  Scope: fast tests that need no secrets and no network             #
#  (unit, Excel-driven, local sandboxes), so no API spend. Also a     #
#  nightly flake hunt: shuffled order, then 4 parallel workers.      #
#                                                                     #
#  On failure: opens one GitHub issue, or comments on the existing    #
#  open one, so repeated nightly failures never spam new issues.      #
#                                                                     #
#  12-month plan, Phase A: scheduled CI run.                          #
# ------------------------------------------------------------------ #
name: Nightly Health Check

on:
  schedule:
    - cron: '0 10 * * *'   # 10:00 UTC = 02:00 Pacific (standard time)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  nightly:
    name: Nightly unit and Excel tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit and Excel-driven tests
        run: |
          pytest -m "unit or excel" \
            --junitxml=reports/nightly.xml \
            --timeout=10 \
            -q \
            --tb=short \
            --no-header

      # Flake hunt: the offline set in a new random order every night, then on
      # 4 parallel workers. An unhandled exception in a helper thread is an error.
      # Replay a failing order locally with the SHUFFLE_SEED printed in the log.
      - name: Flake hunt, shuffled order
        env:
          SHUFFLE_SEED: ${{ github.run_number }}
        run: |
          pytest tests/unit \
            projects/payments/api/tests \
            projects/sql/api/tests \
            tests/integration/test_patient_scheduling_oracle.py \
            projects/fintech/api/tests/test_event_sequencer_per_event.py \
            -p tests.plugins.shuffle_order \
            -W error::pytest.PytestUnhandledThreadExceptionWarning \
            --reruns 0 --timeout=60 -q \
            --junitxml=reports/nightly-shuffled.xml

      - name: Flake hunt, 4 parallel workers
        run: |
          pytest tests/unit \
            projects/payments/api/tests \
            projects/sql/api/tests \
            tests/integration/test_patient_scheduling_oracle.py \
            projects/fintech/api/tests/test_event_sequencer_per_event.py \
            -n 4 \
            -W error::pytest.PytestUnhandledThreadExceptionWarning \
            --reruns 0 --timeout=60 -q --no-header \
            --junitxml=reports/nightly-parallel.xml

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: junit-nightly
          path: reports/

      - name: Open or update failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Nightly health check failing"
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Still failing on $(date -u +%Y-%m-%d). Run: $RUN_URL"
          else
            gh issue create --title "$TITLE" \
              --body "The nightly unit and Excel test run failed on $(date -u +%Y-%m-%d). Run: $RUN_URL. Close this issue once the nightly run is green again."
          fi
