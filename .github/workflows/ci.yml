name: CI — AI Test Automation Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------ #
  #  Unit Tests — no network, no secrets                                #
  # ------------------------------------------------------------------ #
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Unit tests
        run: |
          pytest tests/unit \
            --junitxml=reports/unit-tests.xml \
            -v \
            --tb=short \
            --no-header

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit-tests
          path: reports/

  # ------------------------------------------------------------------ #
  #  API Tests — Patient, Encounter, Observation                        #
  # ------------------------------------------------------------------ #
  api-tests:
    name: FHIR API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run FHIR API tests
        run: |
          pytest projects/healthcare_fhir/api/tests/ projects/healthcare_fhir/api/ai/generated/ \
            --junitxml=reports/api-tests.xml \
            -v \
            -m healthcare \
            --tb=short \
            --no-header

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-api-tests
          path: reports/

  # ------------------------------------------------------------------ #
  #  UI Tests — Playwright HAPI FHIR explorer                          #
  # ------------------------------------------------------------------ #
  ui-tests:
