      - name: Run Performance tests
        run: |
          pytest tests/performance/ \
            --junitxml=reports/performance-tests.xml \
            -v \
            --tb=short \
            --no-header \
            --reruns 2 \
            --reruns-delay 5

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-performance-tests
          path: reports/

  # ------------------------------------------------------------------ #
  #  k6 Performance Baseline                                            #
  # ------------------------------------------------------------------ #
  k6-baseline:
    name: k6 Performance Baseline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 baseline
        run: |
          k6 run shared/performance/k6/baseline.js \
            --duration 30s \
            --vus 1

