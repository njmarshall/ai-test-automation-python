  # ------------------------------------------------------------------ #
  #  Test Summary: combined JUnit results from every pytest job        #
  # ------------------------------------------------------------------ #
  test-summary:
    name: Test Results Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - unit-tests
      - api-tests
      - ui-tests
      - petstore-tests
      - insurance-tests
      - fintech-tests
      - insurance-ui-tests
      - fintech-ui-tests
      - petstore-ui-tests
      - async-polling-tests
      - event-sequencer-tests
      - deepeval-tests
      - guardrails-tests
      - observability-tests
      - fhir-async-tests
      - insurance-async-tests
      - self-healing-agent-tests
      - performance-tests
      - payment-tests
      - flex-tests
      - sql-data-quality-tests

    steps:
      - name: Download JUnit reports
        uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          merge-multiple: true
          path: reports/

      - name: Publish test results
        uses: pmeier/pytest-results-action@main
        with:
          path: reports/*.xml
          summary: true
